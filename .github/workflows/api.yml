name: API

# Triggered only by changes under api/. The path list lives once in scripts/gates.py's
# AREAS, and scripts/tests/test_gates.py fails when this file and that list disagree; the
# same test holds every local check's command to a run line here.
#
# The Postgres steps are CI's alone; api/alembic/CLAUDE.md and api/tests/CLAUDE.md say why.

on:
  pull_request:
    paths:
      - "api/**"
  push:
    branches: [main]
    paths:
      - "api/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded pull-request run answers about a commit nobody waits on. Pushes to main
  # are not cancelled: each merge is the only run that will ever vouch for it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: constellate
          POSTGRES_PASSWORD: constellate
          POSTGRES_DB: constellate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U constellate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # What alembic/env.py reads, through constellate.config: the migration steps run
      # against this database. The test suite provisions its own (below).
      CONSTELLATE_DATABASE_URL: >-
        postgresql+psycopg://constellate:constellate@localhost:5432/constellate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Migrations apply, revert and apply again on an empty database
        # The round trip: api/alembic/CLAUDE.md, "What CI checks".
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Migrations match the models
        # The drift check, and what a non-empty diff means: api/alembic/CLAUDE.md, "What CI checks".
        run: |
          alembic revision --autogenerate -m "drift check" --rev-id drift_check
          if grep -qE '^\s+op\.' alembic/versions/drift_check_*.py; then
            echo "::error::Models and migrations disagree. Run: alembic revision --autogenerate"
            cat alembic/versions/drift_check_*.py
            exit 1
          fi
          rm alembic/versions/drift_check_*.py

      - name: Tests (SQLite)
        run: pytest -q

      - name: Scratch database for the Postgres run
        # tests/conftest.py refuses any database not named `*_test`, to keep the intent
        # explicit before it creates and drops the run's own per-run database. The
        # migration steps above use `constellate`; this is separate.
        run: |
          python - <<'EOF'
          import psycopg
          c = psycopg.connect(
              "host=localhost user=constellate password=constellate dbname=constellate"
          )
          c.autocommit = True
          c.execute("CREATE DATABASE constellate_test")
          EOF

      - name: Tests (Postgres)
        # The second backend, and why both: api/tests/CLAUDE.md, "How they run".
        env:
          CONSTELLATE_TEST_DATABASE_URL: >-
            postgresql+psycopg://constellate:constellate@localhost:5432/constellate_test
        run: pytest -q

      - name: OpenAPI contract is up to date
        run: python scripts/export_openapi.py --check
