[project]
name = "constellate"
version = "0.1.0"
description = "Constellate — activity log and atlas API"
requires-python = ">=3.13"
dependencies = [
    # Database layer.
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # Settings and validation.
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    # HTTP layer.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # ASGI test client for the FastAPI health and endpoint tests.
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constellate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# D1 = the missing-docstring rules. Every public module, class and function carries
# one; see CLAUDE.md. Enforced rather than written down, so it stays true.
select = ["E", "F", "I", "UP", "B", "SIM", "D1"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test names are the documentation; a docstring is added where the *why* is not
# obvious from the name, which is a judgement rather than a rule.
"tests/**" = ["D1"]
# Alembic revisions are generated, and adding docstrings to generated files is noise.
"alembic/**" = ["D1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
