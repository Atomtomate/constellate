[alembic]
# %(here)s expands to the directory containing this file (api/), so the path is
# absolute and correct from any working directory.
script_location = %(here)s/alembic
prepend_sys_path = src
path_separator = os
# The URL is supplied by alembic/env.py from CONSTELLATE_DATABASE_URL so there is
# exactly one place that knows how to reach the database.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
