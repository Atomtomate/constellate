[alembic]
# %(here)s expands to the directory containing this file (api/), so the path is
# absolute and correct from any working directory.
script_location = %(here)s/alembic
prepend_sys_path = src
path_separator = os
# The URL is supplied by alembic/env.py from CONSTELLATE_DATABASE_URL so there is
# exactly one place that knows how to reach the database.

[post_write_hooks]
# Run ruff on every generated revision file so it lands clean and passes the pre-commit
# hook without manual touch-up.
# "module" type runs sys.executable -m <module>, so it uses whatever Python is running
# alembic (venv or CI's site-packages) with no path assumption about executable location.
hooks = ruff_check,ruff_format

ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
